[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bidirectional-hierarchical-transformer"
version = "1.0.0"
description = "Bidirectional Hierarchical Transformer for Cell Type Annotation"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Seok-Won Jang", email = "seokwon@ncc.re.kr" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
py-modules = [
  "model",
  "utils",
  "train",
  "predict",
  "configs"   
  # "transform_celltype_as_hlca",
  # "cellytpist_scimilarity_merged"
]

[project.scripts]
bht-train = "train:main"
bht-predict = "predict:main"
